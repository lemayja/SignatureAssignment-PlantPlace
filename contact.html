  <main>
  <section class="centered-content">
    <h2>Contact Us</h2>

<form class="contact-form" id="contactForm" novalidate>

  <div class="form-group">
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" required>
  </div>

  <div class="form-group">
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" required>
  </div>

  <div class="form-group">
    <label for="city">City</label>
    <input type="text" id="city" required>
  </div>

  <div class="form-group">
    <label for="zip">ZIP Code</label>
    <input type="text" id="zip" required pattern="[0-9]{5}">
  </div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" required>
  </div>

  <div class="form-group">
    <label for="subject">Subject</label>
    <select id="subject" required>
      <option value="">--Select--</option>
      <option>Plant Question</option>
      <option>Order Inquiry</option>
      <option>Care Help</option>
    </select>
  </div>

  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" rows="6" required></textarea>
  </div>

  <button type="submit">Send Message</button>

</form>

  </section>

  <div class="divider"></div>

      <section class="featured">
      <h2>Featured Plants</h2>

      <div class="plant-gallery">

        <article>
          <img src="images/alocasia.jpg" alt="Alocasia">
          <h3>Alocasia</h3>
          <p>$42</p>
        </article>

        <article>
          <img src="images/monstera.jpg" alt="Monstera">
          <h3>Monstera</h3>
          <p>$38</p>
        </article>

        <article>
          <img src="images/pothos.jpg" alt="Pothos">
          <h3>Pothos</h3>
          <p>$22</p>
        </article>

      </div>
    </section>

</main>
